<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learning Tailwind CSS</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <!-- <script src="https://cdn.tailwindcss.com"></script> -->
</head>
<body class="font-mono bg-orange-200 sm:bg-orange-400 md:bg-orange-60 
md:bg-orange-600 lg:bg-orange-800 xl:bg-orange-900 ">
    <h1 class="font-sans ml-5">
        <!-- ml mane margin left  -->
      Hello world!
    </h1>
     <h1 class="font-serif font-bold pl-5">
      Hello world!
    </h1>
     <h1 class="hover:font-extrabold text-9xl tracking-widest pl-8">
      Hello world!
    </h1>

    <h1  class="leading-6">
     
         heloow sminnndsjasdopj 

    </h1>


    <h1 class="underline">
       hellow charle gari vorbe 
    </h1>

    <h2 class="text-4xl font-semibold text-left  text-red-900">
      Welcome to learning Tailwind CSS!
    </h2>

    <ul class="list-decimal ml-[10px] list-inside mb-28 ">

        <!-- mb-28 == margin bottom  -->
        <li class="bg-[#71f873]">
           HTML
        </li>
        <li class="bg-[#8371f8]">
          CSS
        </li>
        <li class="bg-[#f87171]">
          JSS
        </li>    
    </ul>
    <div class="w-20 h-20 bg-violet-500 mx-auto rounded-full border-2 border-green-500 border-dashed">
        <!-- m = margin
        x = left and right sides
         auto = set margin to auto (centers the element horizontally if it has a width) -->
      

    </div>   


    <button class="mx-10 my-10 inline-block bg-red-600 text-white font-light 
    text-lg py-3 px-5 rounded-full hover:bg-red-900 hover:transition-colors 
    focus:ring-2 ring-offset-2
    ring-green-700">
        Subscribe
    </button>
    <button class="btn">
        Subscribe
    </button>

    


  
</body>
</html>
